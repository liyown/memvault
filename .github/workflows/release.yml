name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web assets
        run: |
          cd web
          npm ci
          npm run build

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          make dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body: |
            Release ${{ steps.version.outputs.version }}

            Commit: ${{ steps.version.outputs.commit }}

            ## Installation

            ### macOS (Homebrew)
            ```bash
            brew tap memvault-org/tap
            brew install memvault
            ```

            ### Manual
            Download the appropriate archive for your platform and extract it:
            ```bash
            tar xzf memvault_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            sudo mv memvault /usr/local/bin/
            ```
          draft: false
          prerelease: false
