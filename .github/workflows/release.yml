name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          python3 scripts/test_install.py

      - name: Build packages and formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make dist
          ./scripts/brew-formula.sh "$VERSION"
          cp scripts/install.sh dist/install.sh

      - name: Smoke test installer
        env:
          VERSION: ${{ github.ref_name }}
          INSTALL_DIR: ${{ runner.temp }}/memvault-install
        run: |
          bash dist/install.sh
          test "$("$INSTALL_DIR/memvault" version)" = "${VERSION#v}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/memvault_*.tar.gz
            dist/memvault_*.zip
            dist/SHA256SUMS
            dist/memvault.rb
            dist/install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Install

            Homebrew (macOS / Linux):
            ```sh
            brew install liyown/tap/memvault
            ```

            Shell installer (latest stable release, SHA-256 verified):
            ```sh
            curl -fsSL https://github.com/liyown/memvault/releases/latest/download/install.sh | bash
            ```

            For this specific release, download its install.sh and run it with VERSION set to the tag shown above. Archives for macOS, Linux, and Windows and their SHA256SUMS are attached below.

  homebrew:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: liyown/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Download published formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern memvault.rb --dir "$RUNNER_TEMP/formula"
          mkdir -p tap/Formula
          cp "$RUNNER_TEMP/formula/memvault.rb" tap/Formula/memvault.rb

      - name: Update tap
        working-directory: tap
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/memvault.rb
          if ! git diff --cached --quiet; then
            git commit -m "memvault ${RELEASE_TAG#v}"
            git push origin main
          fi
